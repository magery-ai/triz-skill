name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s evals/tests -v
      - name: Resolve the tag
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['metadata']['version'])")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Build zip
        run: python tools/build_zip.py --out dist
      - name: Release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os, re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          version = os.environ["TAG"].lstrip("v")
          match = re.search(rf"^## {re.escape(version)}\b.*?\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          open("notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
