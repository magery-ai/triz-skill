  <rect class="track" x="470" y="364" width="620" height="24" rx="4"/>
  <rect class="with" x="470" y="364" width="620" height="24" rx="4"/>
  <text class="ink" x="1104" y="383" font-size="18" font-weight="600">13 / 13</text>
