<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Eval results on 13 cases. Names the root conflict: with the skill 13 of 13, without 10 of 13. Passes the case-specific checks: 32 of 33 against 22 of 33. Ends with a dated, measurable target: 13 of 13 against 7 of 13. Gives a risk signal with a threshold: 13 of 13 against 6 of 13. Preferred by the blind grader: 11 of 13 against 2 of 13.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #FFFFFF; } .ink { fill: #18202C; } .muted { fill: #6B7588; }
    .with { fill: #1D5BB0; } .without { fill: #A3ACBA; } .track { fill: #EEF1F5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0D1117; } .ink { fill: #E4E9F1; } .muted { fill: #9AA6B8; }
      .with { fill: #7EB0F2; } .without { fill: #5C6676; } .track { fill: #1B222C; }
    }
  </style>
  <rect class="bg" width="1200" height="640" rx="16"/>
  <text class="ink" x="40" y="58" font-size="28" font-weight="700">Same 13 problems, with and without the skill</text>
