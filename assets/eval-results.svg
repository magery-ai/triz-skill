<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Eval results on 13 cases, three runs per arm, mean over runs with range. Names the root conflict: with the skill 13 / 13, without 8.3 / 13 (8-9). Passes the case-specific checks: with the skill 32.7 / 33 (32-33), without 21 / 33 (19-23). Ends with a dated, measurable target: with the skill 13 / 13, without 1.3 / 13 (0-3). Gives a risk signal with a threshold: with the skill 13 / 13, without 2 / 13 (1-3). Preferred by the blind grader: with the skill 12.7 / 13 (12-13), without 0.3 / 13 (0-1).">
