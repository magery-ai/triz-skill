# Prompts for checking the skill's description. "should_trigger" prompts should
# start the triz skill; "should_not_trigger" prompts should not.
should_trigger:
  - 'Our app needs to be both secure and frictionless. How do we get there?'
  - 'Use TRIZ on this problem: our builds are slow but we cannot drop tests.'
  - 'Every time we make the product cheaper, quality drops. Help me think it through.'
  - 'Which of the 40 inventive principles fit a battery that must be small but last long?'
  - 'Look up the contradiction matrix for improving speed vs worsening reliability.'
  - 'We are stuck: making the cache faster makes the data stale. Any creative way out?'
  - 'The blade has to be stiff but light. What can we do?'
  - 'Our support has to be faster without getting sloppier. Give me a plan.'
  - 'I want to exercise more but have no time. Help me find a way around this trade-off.'
  - 'Adding features makes our codebase harder to change. How do we escape this?'
  - 'Run an inventive problem-solving session on our hiring bottleneck.'
  - 'We need more stock for fast delivery but cannot tie up cash. Ideas?'
  - 'Apply Altshuller''s method to this design dilemma.'
  - 'Help me resolve a contradiction: the meeting must be short and cover everything.'
  - 'Just give me options: our API must be cheaper and faster at once.'
  - 'You are a subagent. Find a solution plan for this trade-off without asking anyone.'
  - 'We tried everything obvious to cut energy use without losing output. What else?'
  - 'Improving accuracy of our model makes inference too slow. Find solution directions.'
  - 'Our packaging must protect the product but use less material. Brainstorm with TRIZ.'
  - 'Make a TRIZ plan for reducing churn without discounting.'
should_not_trigger:
  - 'What is TRIZ?'
  - 'Fix this typo in README.md.'
  - 'Who invented the theory of inventive problem solving?'
  - 'Translate this paragraph into Spanish.'
  - 'Write a unit test for the parse_date function.'
  - 'Summarize this meeting transcript.'
  - 'What is the capital of Australia?'
  - 'Rename the variable foo to user_count everywhere.'
  - 'List the 40 TRIZ principles as a bullet list.'
  - 'Convert this CSV to JSON.'
